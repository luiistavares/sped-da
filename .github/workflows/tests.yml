name: tests

on:
  push:
    branches: [consultadanfe]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint (php -l)
        run: find src examples tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: PHPUnit (renderiza todos os exemplos)
        run: vendor/bin/phpunit

      - name: Gerar os PDFs de exemplo
        run: php examples/gerar.php
